name: Test coverage

on: [push, pull_request]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Lean
        shell: bash
        run: |
          toolchain=/tmp/opencode/elan/toolchains/leanprover--lean4---v4.19.0
          mkdir -p "$toolchain"
          curl -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst |
            tar --zstd --strip-components=1 -x -C "$toolchain"
          "$toolchain/bin/lean" --version
      - run: pnpm test:coverage
