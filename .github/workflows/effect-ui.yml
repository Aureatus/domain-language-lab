name: Effect UI spike

on:
  pull_request:
    paths:
      - '.github/workflows/effect-ui.yml'
      - 'adapters/effect-ui/**'
      - 'adapters/effect/**'
      - 'application/**'
      - 'leave/**'
      - 'semantic/**'
      - 'syntax/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter premise-effect-ui-spike test
