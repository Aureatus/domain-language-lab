<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><header><a class="brand" href="/" id="brand">Application</a><div class="session"><span id="connection" role="status">Connecting…</span><label>Viewing as <select id="actor" aria-label="Viewing as"></select></label></div></header>
<main><section class="intro"><p class="eyebrow" id="eyebrow" hidden></p><h1 id="heading"></h1><p id="subtitle"></p></section><p id="notice" role="status" hidden></p><div class="layout"><div><section id="summaries" class="summaries"></section><section id="forms"></section></div><div><section class="panel" id="inbox-panel"><h2>Approval inbox</h2><p class="muted">Review saved requests. Approval and completion are separate steps.</p><div id="inbox"></div></section><section id="lists"></section></div></div><footer id="scope"></footer></main></div>
<aside id="companion" hidden><h2>Declaration companion</h2><p>Actual action declaration and returned result · not a parser trace</p><button id="current-evidence" type="button">Current preview</button><button id="saved-evidence" type="button">Last action result</button><pre id="evidence"></pre></aside><script type="module" src="/app.js"></script></body></html>
